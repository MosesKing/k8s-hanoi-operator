# This rule is not used by the project hanoi-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the hanoi.mosesking.github.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hanoi-operator
    app.kubernetes.io/managed-by: kustomize
  name: towerchallenge-editor-role
rules:
- apiGroups:
  - hanoi.mosesking.github.io
  resources:
  - towerchallenges
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - hanoi.mosesking.github.io
  resources:
  - towerchallenges/status
  verbs:
  - get
