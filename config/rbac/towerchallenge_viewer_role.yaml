# This rule is not used by the project hanoi-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to hanoi.mosesking.github.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hanoi-operator
    app.kubernetes.io/managed-by: kustomize
  name: towerchallenge-viewer-role
rules:
- apiGroups:
  - hanoi.mosesking.github.io
  resources:
  - towerchallenges
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - hanoi.mosesking.github.io
  resources:
  - towerchallenges/status
  verbs:
  - get
